name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python lint and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: etl/requirements*.txt
      - run: pip install -r etl/requirements-dev.txt
      - name: Lint
        run: |
          ruff check etl validation
          ruff format --check etl validation
      - name: Test
        working-directory: etl
        run: python -m pytest -q

  node:
    name: Node lint and tests
    runs-on: ubuntu-latest
    services:
      fhir:
        image: hapiproject/hapi:v8.12.0-2
        ports:
          - 8080:8080
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            api/package-lock.json
            web/package-lock.json
      - name: API lint, typecheck and unit tests
        working-directory: api
        run: |
          npm ci
          npm run lint
          npm run typecheck
          npm test
      - name: Web lint and build
        working-directory: web
        run: |
          npm ci
          npm run lint
          npm run build
      - name: Wait for HAPI FHIR
        run: |
          for i in $(seq 1 60); do
            curl -sf http://localhost:8080/fhir/metadata > /dev/null && exit 0
            sleep 5
          done
          echo "HAPI FHIR did not start" && exit 1
      - name: API integration test
        working-directory: api
        env:
          FHIR_INTEGRATION_URL: http://localhost:8080/fhir
        run: npm run test:integration

  docker:
    name: Docker build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Build API image
        run: docker build -t fhir-pipeline-api:ci ./api
      - name: Build web image
        run: docker build -t fhir-pipeline-web:ci ./web
