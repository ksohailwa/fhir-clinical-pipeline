services:
  fhir:
    image: hapiproject/hapi:v8.12.0-2
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/hapi
      SPRING_DATASOURCE_USERNAME: admin
      SPRING_DATASOURCE_PASSWORD: admin
      SPRING_DATASOURCE_DRIVERCLASSNAME: org.postgresql.Driver
      SPRING_JPA_PROPERTIES_HIBERNATE_DIALECT: ca.uhn.fhir.jpa.model.dialect.HapiFhirPostgresDialect
      HAPI_FHIR_FHIR_VERSION: R4
    depends_on:
      db:
        condition: service_healthy

  api:
    build: ./api
    env_file:
      - path: .env
        required: false
    environment:
      FHIR_BASE_URL: http://fhir:8080/fhir
    ports:
      - "3001:3001"
    depends_on:
      - fhir

  web:
    build: ./web
    ports:
      - "3000:80"
    depends_on:
      - api

  db:
    image: postgres:16.16
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
      POSTGRES_DB: hapi
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d hapi"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
