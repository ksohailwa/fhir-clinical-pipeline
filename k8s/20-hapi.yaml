apiVersion: apps/v1
kind: Deployment
metadata:
  name: fhir
  namespace: fhir-demo
  labels: { app: fhir }
spec:
  replicas: 1
  selector:
    matchLabels: { app: fhir }
  template:
    metadata:
      labels: { app: fhir }
    spec:
      containers:
        - name: hapi
          image: hapiproject/hapi:v8.12.0-2
          ports:
            - containerPort: 8080
          env:
            - name: SPRING_DATASOURCE_URL
              value: jdbc:postgresql://db:5432/hapi
            - name: SPRING_DATASOURCE_USERNAME
              valueFrom:
                secretKeyRef: { name: db-credentials, key: POSTGRES_USER }
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef: { name: db-credentials, key: POSTGRES_PASSWORD }
            - name: SPRING_DATASOURCE_DRIVERCLASSNAME
              value: org.postgresql.Driver
            - name: SPRING_JPA_PROPERTIES_HIBERNATE_DIALECT
              value: ca.uhn.fhir.jpa.model.dialect.HapiFhirPostgresDialect
            - name: HAPI_FHIR_FHIR_VERSION
              value: R4
          # HAPI needs about a minute to boot; the startup probe allows up to five.
          startupProbe:
            httpGet: { path: /fhir/metadata, port: 8080 }
            periodSeconds: 10
            failureThreshold: 30
          readinessProbe:
            httpGet: { path: /fhir/metadata, port: 8080 }
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet: { path: /fhir/metadata, port: 8080 }
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 3
          resources:
            requests: { cpu: 250m, memory: 1Gi }
            limits: { memory: 2Gi }
---
apiVersion: v1
kind: Service
metadata:
  name: fhir
  namespace: fhir-demo
spec:
  selector: { app: fhir }
  ports:
    - port: 8080
      targetPort: 8080
