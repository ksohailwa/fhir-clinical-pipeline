# Expects a Secret named llm-api-key with ANTHROPIC_API_KEY, created from .env:
#   kubectl -n fhir-demo create secret generic llm-api-key --from-env-file=.env
# Without it the API starts and the summary endpoint returns 503.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: fhir-demo
  labels: { app: api }
spec:
  replicas: 1
  selector:
    matchLabels: { app: api }
  template:
    metadata:
      labels: { app: api }
    spec:
      containers:
        - name: api
          image: fhir-pipeline-api:local
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3001
          env:
            - name: FHIR_BASE_URL
              value: http://fhir:8080/fhir
            - name: ANTHROPIC_API_KEY
              valueFrom:
                secretKeyRef: { name: llm-api-key, key: ANTHROPIC_API_KEY, optional: true }
          # Ready only once the FHIR server answers /fhir/metadata.
          readinessProbe:
            httpGet: { path: /api/ready, port: 3001 }
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet: { path: /api/health, port: 3001 }
            periodSeconds: 20
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits: { memory: 256Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: fhir-demo
spec:
  selector: { app: api }
  ports:
    - port: 3001
      targetPort: 3001
