apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: fhir-demo
  labels: { app: web }
spec:
  replicas: 1
  selector:
    matchLabels: { app: web }
  template:
    metadata:
      labels: { app: web }
    spec:
      containers:
        - name: web
          image: fhir-pipeline-web:local
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet: { path: /, port: 80 }
            periodSeconds: 10
          resources:
            requests: { cpu: 25m, memory: 32Mi }
            limits: { memory: 64Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: web
  namespace: fhir-demo
spec:
  selector: { app: web }
  ports:
    - port: 80
      targetPort: 80
